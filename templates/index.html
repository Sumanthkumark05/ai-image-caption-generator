<!DOCTYPE html>
<html>

<head>

    <title>AI Image Caption Generator</title>

    <style>

        body{
            font-family: Arial;
            background: #f4f4f4;
            text-align: center;
            padding: 50px;
        }

        .container{
            background: white;
            padding: 30px;
            width: 500px;
            margin: auto;
            border-radius: 10px;
        }

        img{
            width: 300px;
            margin-top: 20px;
            border-radius: 10px;
        }

        button{
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>AI Image Caption Generator</h1>

    <form method="POST" enctype="multipart/form-data">

        <input type="file" name="image" required>

        <br><br>

        <button type="submit">
            Generate Caption
        </button>

    </form>

    {% if image_file %}

        <img src="{{ url_for('static', filename='uploads/' + image_file) }}">

    {% endif %}

    {% if caption %}

        <h2>Generated Caption:</h2>

        <p>{{ caption }}</p>

    {% endif %}

</div>

</body>

</html>
